<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catur Kayu Klasik - 2 Pemain Berhadapan</title>
    <!-- Library Chess.js untuk aturan resmi catur -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --bg-color: #2c221e;
            --panel-bg: #3d312a;
            --accent-wood: #c8965c;
            --text-light: #f4eee2;
            --light-square: #ebd9b4;
            --dark-square: #b58863;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent-wood);
            margin-bottom: 5px;
        }

        p {
            font-size: 0.95rem;
            color: #b0a89f;
        }

        .container {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1050px;
            width: 100%;
        }

        /* Area Papan Catur */
        .board-wrapper {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            width: 100%;
            justify-content: center;
        }

        button {
            background-color: var(--accent-wood);
            color: #1e1713;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #dfb17b;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        #chessboard {
            display: grid;
            grid-template-columns: repeat(8, 65px);
            grid-template-rows: repeat(8, 65px);
            border: 5px solid #1a1411;
            border-radius: 6px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .light {
            background-color: var(--light-square);
        }

        .dark {
            background-color: var(--dark-square);
        }

        .square.selected {
            background-color: #bbc92e !important;
        }

        .square.possible-move::after {
            content: '';
            width: 20px;
            height: 20px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            position: absolute;
        }

        /* Panel Samping Informasi */
        .sidebar {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 14px;
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .card {
            background: #2c221e;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-wood);
        }

        .card h3 {
            font-size: 0.95rem;
            color: var(--accent-wood);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card p {
            font-size: 1.1rem;
            color: var(--text-light);
            font-weight: bold;
        }

        .history-card {
            flex-grow: 1;
            max-height: 220px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #d1c7bd;
            line-height: 1.5;
        }

        /* Responsif untuk layar kecil/tablet */
        @media (max-width: 700px) {
            #chessboard {
                grid-template-columns: repeat(8, 44px);
                grid-template-rows: repeat(8, 44px);
            }
            .square {
                font-size: 30px;
            }
            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Catur Klasik Kayu</h1>
        <p>Mode Berhadapan Langsung (Papan Tetap, Tanpa Putar Layar)</p>
    </header>

    <div class="container">
        <!-- Bagian Papan -->
        <div class="board-wrapper">
            <div class="toolbar">
                <button onclick="resetGame()">Mulai Baru</button>
                <button onclick="undoMove()">Undo Langkah</button>
            </div>
            <div id="chessboard"></div>
        </div>

        <!-- Bagian Informasi & Status -->
        <div class="sidebar">
            <div class="card">
                <h3>Giliran Saat Ini</h3>
                <p id="turn-display">Putih (Bawah)</p>
            </div>
            <div class="card">
                <h3>Status Permainan</h3>
                <p id="status-display" style="font-size: 1rem;">Sedang Berlangsung</p>
            </div>
            <div class="card history-card">
                <h3>Riwayat Langkah</h3>
                <div id="history-content">- Belum ada langkah</div>
            </div>
        </div>
    </div>

    <script>
        const chess = new Chess();
        let selectedSquare = null;
        let possibleMoves = [];

        // Simbol unicode untuk bidak catur
        const pieceSymbols = {
            p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
            P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
        };

        // Audio efek sederhana menggunakan Web Audio API
        function playMoveSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {
                // Abaikan jika audio tidak diizinkan browser
            }
        }

        function renderBoard() {
            const boardElement = document.getElementById('chessboard');
            boardElement.innerHTML = '';

            // Render papan dari sudut pandang tetap (Putih di bawah [baris 7 ke 0], Hitam di atas [baris 0 ke 7])
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareEl = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    squareEl.className = `square ${isLight ? 'light' : 'dark'}`;

                    // Notasi catur standar (a8 sampai h1)
                    const file = String.fromCharCode(97 + c);
                    const rank = 8 - r;
                    const squareName = file + rank;

                    squareEl.dataset.square = squareName;

                    // Tandai petak yang sedang dipilih
                    if (selectedSquare === squareName) {
                        squareEl.classList.add('selected');
                    }

                    // Tandai langkah yang valid
                    if (possibleMoves.includes(squareName)) {
                        squareEl.classList.add('possible-move');
                    }

                    // Masukkan bidak jika ada
                    const piece = chess.get(squareName);
                    if (piece) {
                        squareEl.textContent = pieceSymbols[piece.color === 'w' ? piece.type.toUpperCase() : piece.type];
                        squareEl.style.color = piece.color === 'w' ? '#ffffff' : '#1a1411';
                        // Berikan sedikit bayangan agar bidak tampak timbul di atas kayu
                        squareEl.style.textShadow = piece.color === 'w' ? '0 2px 4px rgba(0,0,0,0.6)' : '0 1px 2px rgba(255,255,255,0.2)';
                    }

                    squareEl.addEventListener('click', () => onSquareClick(squareName));
                    boardElement.appendChild(squareEl);
                }
            }
            updateUIStatus();
        }

        function onSquareClick(square) {
            if (chess.game_over()) return;

            if (selectedSquare === null) {
                // Pilih bidak sesuai giliran
                const piece = chess.get(square);
                if (piece && piece.color === chess.turn()) {
                    selectedSquare = square;
                    const moves = chess.moves({ square: square, verbose: true });
                    possibleMoves = moves.map(m => m.to);
                    renderBoard();
                }
            } else {
                // Coba jalankan langkah ke petak tujuan
                const moveResult = chess.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q' // Otomatis promosi ke Ratu
                });

                selectedSquare = null;
                possibleMoves = [];

                if (moveResult === null) {
                    // Jika klik petak lain milik sendiri, pindah seleksi
                    const piece = chess.get(square);
                    if (piece && piece.color === chess.turn()) {
                        selectedSquare = square;
                        const moves = chess.moves({ square: square, verbose: true });
                        possibleMoves = moves.map(m => m.to);
                    }
                } else {
                    playMoveSound();
                }
                renderBoard();
            }
        }

        function updateUIStatus() {
            const turnDisplay = document.getElementById('turn-display');
            const statusDisplay = document.getElementById('status-display');
            const historyContent = document.getElementById('history-content');

            // Giliran
            turnDisplay.textContent = chess.turn() === 'w' ? 'Putih (Bawah)' : 'Hitam (Atas)';

            // Status game
            let statusText = 'Sedang Berlangsung';
            if (chess.in_checkmate()) {
                statusText = 'Skakmat! ' + (chess.turn() === 'w' ? 'Hitam Menang!' : 'Putih Menang!');
            } else if (chess.in_draw()) {
                statusText = 'Permainan Seri (Draw)!';
            } else if (chess.in_check()) {
                statusText = 'Skak (Check)!';
            }
            statusDisplay.textContent = statusText;

            // Riwayat langkah
            const history = chess.history();
            if (history.length > 0) {
                let formattedHistory = '';
                for (let i = 0; i < history.length; i += 2) {
                    const moveNum = (i / 2) + 1;
                    const whiteMove = history[i] || '';
                    const blackMove = history[i + 1] || '';
                    formattedHistory += `${moveNum}. ${whiteMove} ${blackMove}<br>`;
                }
                historyContent.innerHTML = formattedHistory;
                historyContent.scrollTop = historyContent.scrollHeight;
            } else {
                historyContent.innerHTML = '- Belum ada langkah';
            }
        }

        function resetGame() {
            chess.reset();
            selectedSquare = null;
            possibleMoves = [];
            renderBoard();
        }

        function undoMove() {
            chess.undo();
            selectedSquare = null;
            possibleMoves = [];
            renderBoard();
        }

        // Render awal saat halaman dimuat
        renderBoard();
    </script>
</body>
</html>
